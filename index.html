<!doctype html><html lang="en"><head><meta charset="utf-8"><title>City Walk</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
:root{--bg:#0e1320;--fg:#f2f5fa;--pn:rgba(14,19,32,.75);--ac:#ff5d7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#dfe8f5;--fg:#101624;--pn:rgba(255,255,255,.8);color-scheme:light}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);text-align:center;padding:24px}
.btn,button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 15px system-ui;display:inline-block}
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;display:flex;gap:8px}
#bar button{background:var(--pn);color:var(--fg);padding:10px 14px}
#st{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;opacity:.7}
#sb{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:var(--pn);display:none;pointer-events:none}
#kn{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--ac)}
</style></head><body>
<canvas id="c"></canvas>
<div id="ld"><div><h2>City Walk</h2><p id="msg">Loading character…</p>
<label class="btn" id="pk" hidden>Choose city_lite.glb<input id="fi" type="file" hidden></label></div></div>
<div id="bar" hidden><button id="run">Walk</button><button id="sm">−</button><button id="bg">+</button></div>
<div id="sb"><div id="kn"></div></div><div id="st" hidden>Left: move · Right: look</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const $=i=>document.getElementById(i),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sm=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const b64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer};
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene();S.background=new THREE.Color(0xa9c7e8);
S.add(new THREE.HemisphereLight(0xffffff,0x778899,1.1));
const sun=new THREE.DirectionalLight(0xffffff,0.9);sun.position.set(.4,1,.3);S.add(sun);
const cam=new THREE.PerspectiveCamera(60,1,.1,1000);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const loader=new THREE.GLTFLoader();
let holder,rig,parts=[],meshes=[],box,ext=100,H=1.8,run=false,sizeMul=1;
const pos=new THREE.Vector3(),dir=new THREE.Vector3();
let face=0,camYaw=0,camPitch=.35,spd=0,phase=0,gy=0,blocked=false,tickT=0,tgt=null;

// ---- fake skeleton weights (the model has no rig) ----
function prep(m,type){
  const p=m.geometry.attributes.position,n=p.count,rest=p.array.slice(),w=new Float32Array(n*5);
  for(let i=0;i<n;i++){const x=rest[3*i],y=rest[3*i+1],z=rest[3*i+2],ax=Math.abs(x);
    let leg=0,knee=0,arm=0,el=0;
    if(type==='body'){
      leg=sm(-.10,-.26,y)*(.25+.75*sm(-.22,-.10,z));knee=sm(-.50,-.66,y);
      arm=sm(.17,.25,ax)*sm(.55,.42,y)*sm(-.18,-.12,y);el=sm(.22,.06,y);
    }else if(type==='hand'){arm=1;el=1}
    else if(type==='hair')leg=sm(.72,.30,y);
    w.set([leg,sm(-.05,.05,x),knee,arm,el],5*i);
  }
  m.userData={rest,w,type,p};m.frustumCulled=false;
}
function rotX(o,py,pz,a,y,z){const c=Math.cos(a),s=Math.sin(a),dy=y-py,dz=z-pz;o[0]=py+dy*c-dz*s;o[1]=pz+dy*s+dz*c}
function skin(m,P){
  const {rest,w,type,p}=m.userData,out=p.array,n=p.count,t=[0,0];
  for(let i=0;i<n;i++){
    let x=rest[3*i],y=rest[3*i+1],z=rest[3*i+2];const j=5*i,wl=w[j],s=w[j+1],wk=w[j+2],wa=w[j+3],we=w[j+4];
    if(type==='hair'){if(wl>0){rotX(t,.78,-.05,P.sway*wl,y,z);y=t[0];z=t[1]}}
    else if(wa>0){
      const L=x>0,sh=L?.19:-.19;
      if(we>0){rotX(t,.14,0,-(L?P.el:P.er)*we,y,z);y=t[0];z=t[1]}
      const a=(L?-1:1)*P.ad*wa,c=Math.cos(a),sn=Math.sin(a),dx=x-sh,dy=y-.38;
      x=sh+dx*c-dy*sn;y=.38+dx*sn+dy*c;
      rotX(t,.38,0,-(L?P.al:P.ar)*wa,y,z);y=t[0];z=t[1];
    }else if(wl>0){
      const f=P.hr+(P.hl-P.hr)*s,k=P.kr+(P.kl-P.kr)*s;
      if(wk>0){rotX(t,-.58,-.02,k*wk,y,z);y=t[0];z=t[1]}
      rotX(t,-.15,-.02,-f*wl,y,z);y=t[0];z=t[1];
    }
    out[3*i]=x;out[3*i+1]=y;out[3*i+2]=z;
  }
  p.needsUpdate=true;
}

// ---- ground / simple collision ----
const rc=new THREE.Raycaster(),dn=new THREE.Vector3(0,-1,0),og=new THREE.Vector3();
function hits(x,z,y,range){
  const c=meshes.filter(m=>{const b=m.userData.b;return x>=b.min.x&&x<=b.max.x&&z>=b.min.z&&z<=b.max.z&&b.min.y<=y&&b.max.y>=y-range});
  if(!c.length)return[];og.set(x,y,z);rc.set(og,dn);rc.far=range;return rc.intersectObjects(c,false);
}
const groundAt=(x,z)=>{const h=hits(x,z,pos.y+.9*H,3*H);return h.length?h[0].point.y:null};
function spawn(){
  const cx=(box.min.x+box.max.x)/2,cz=(box.min.z+box.max.z)/2,hh=box.max.y-box.min.y+2;
  for(let r=0;r<=.4;r+=.05)for(let a=0;a<6.3;a+=1.05){
    const x=cx+Math.cos(a)*r*ext,z=cz+Math.sin(a)*r*ext,h=hits(x,z,box.max.y+1,hh);
    if(h.length){pos.set(x,h[h.length-1].point.y,z);gy=pos.y;return}
  }
  pos.set(cx,box.min.y,cz);gy=pos.y;
}

// ---- character ----
function setSize(){holder.scale.setScalar(1);rig.scale.setScalar(H/1.83)}
function loadChar(){
  fetch('mai_lite.glb').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(buf=>loader.parse(buf,'',g=>{
    holder=new THREE.Group();rig=new THREE.Group();rig.add(g.scene);g.scene.position.y=1;
    g.scene.traverse(o=>{if(!o.isMesh)return;const mt=o.material,nm=mt.name;
      mt.normalMap=null;mt.side=THREE.DoubleSide;mt.needsUpdate=true;
      o.geometry=o.geometry.clone();
      prep(o,nm.startsWith('uppr')?'body':nm.startsWith('lowr')?'hand':nm.startsWith('hair')?'hair':'head');
      if(o.userData.type!=='head')parts.push(o)});
    holder.add(rig);S.add(holder);
    $('msg').textContent='Loading city… (about 28 MB)';
    Promise.all(['city_part1.bin','city_part2.bin'].map(u=>fetch(u).then(r=>r.ok?r.arrayBuffer():Promise.reject()))).then(a=>{
      const o=new Uint8Array(a[0].byteLength+a[1].byteLength);o.set(new Uint8Array(a[0]),0);o.set(new Uint8Array(a[1]),a[0].byteLength);loadCity(o.buffer)
    }).catch(()=>{$('msg').textContent='City parts not found next to index.html. Pick city_lite.glb manually:';$('pk').hidden=false});
  },e=>$('msg').textContent='Character failed: '+e.message)).catch(()=>$('msg').textContent='Could not load mai_lite.glb — upload it next to index.html.');
}
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;$('msg').textContent='Reading city… (can take a few seconds)';
  $('pk').hidden=true;const fr=new FileReader();fr.onload=()=>loadCity(fr.result);fr.readAsArrayBuffer(f)};
function loadCity(buf){
  loader.parse(buf,'',g=>{
    S.add(g.scene);g.scene.updateMatrixWorld(true);
    box=new THREE.Box3().setFromObject(g.scene);const sz=box.getSize(new THREE.Vector3());
    ext=Math.max(sz.x,sz.z);H=ext*.0045;
    g.scene.traverse(o=>{if(o.isMesh){o.userData.b=new THREE.Box3().setFromObject(o);meshes.push(o)}});
    S.fog=new THREE.Fog(0xa9c7e8,ext*.6,ext*3);cam.near=H*.1;cam.far=ext*5;cam.updateProjectionMatrix();
    setSize();spawn();$('ld').hidden=true;$('bar').hidden=false;$('st').hidden=false;last=performance.now();loop();
  },e=>{$('msg').textContent='City failed: '+e.message;$('pk').hidden=false});
}

// ---- input ----
let sx=0,sy=0,sid=null,so=null,lid=null,lx=0,ly=0;
const cv=$('c');
cv.addEventListener('pointerdown',e=>{
  if(e.clientX<innerWidth*.5&&sid===null){sid=e.pointerId;so=[e.clientX,e.clientY];const b=$('sb');b.style.display='block';b.style.left=so[0]+'px';b.style.top=so[1]+'px'}
  else if(lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}
});
addEventListener('pointermove',e=>{
  if(e.pointerId===sid){let dx=e.clientX-so[0],dy=e.clientY-so[1];const l=Math.hypot(dx,dy),m=60;if(l>m){dx*=m/l;dy*=m/l}
    sx=dx/m;sy=-dy/m;$('kn').style.transform=`translate(${dx}px,${dy}px)`}
  else if(e.pointerId===lid){camYaw-=(e.clientX-lx)*.006;camPitch=clamp(camPitch+(e.clientY-ly)*.005,.05,1.3);lx=e.clientX;ly=e.clientY}
});
const up=e=>{if(e.pointerId===sid){sid=null;sx=sy=0;$('sb').style.display='none';$('kn').style.transform=''}if(e.pointerId===lid)lid=null};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
$('run').onclick=e=>{run=!run;e.target.textContent=run?'Run':'Walk'};
$('sm').onclick=()=>{H/=1.25;setSize()};$('bg').onclick=()=>{H*=1.25;setSize()};

// ---- main loop ----
let last=0;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
  const mag=Math.min(1,Math.hypot(sx,sy));let tv=0;
  if(mag>.1){
    const fy=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);
    dir.set(fy*sy+rx*sx,0,fz*sy+rz*sx).normalize();tv=(run?2.4:.85)*H*mag;
    let d=Math.atan2(dir.x,dir.z)-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*Math.min(1,dt*10);
  }
  spd+=(tv-spd)*Math.min(1,dt*8);
  // terrain probe ~16x/sec: step up limit + no walking off the map
  tickT-=dt;
  if(tickT<=0){tickT=.06;blocked=false;
    if(spd>.05*H){const l=spd*.25+.3*H,nx=pos.x+dir.x*l,nz=pos.z+dir.z*l,g=groundAt(nx,nz);
      if(g===null||g-pos.y>.4*H)blocked=true;else tgt=g}
    else{const g=groundAt(pos.x,pos.z);if(g!==null)tgt=g}}
  if(!blocked&&spd>.01){pos.x+=dir.x*spd*dt;pos.z+=dir.z*spd*dt}
  if(tgt!==null)gy+=(tgt-gy)*Math.min(1,dt*12);pos.y=gy;
  // gait
  const v=blocked?0:spd/H,rb=clamp((v-.85)/1.5,0,1),mb=clamp(v/.3,0,1);
  phase+=2*Math.PI*(v*H)/(H*(.9+.3*rb))*dt;
  const A=(.42+.5*rb)*mb,K=(.75+.5*rb)*mb,Aa=(.38+.7*rb)*mb,sn=Math.sin(phase),sn2=Math.sin(phase+Math.PI);
  const bend=ph=>Math.max(0,Math.cos(ph+.3));
  const al=-Aa*sn,ar=-Aa*sn2;
  const P={hl:A*sn,hr:A*sn2,kl:K*bend(phase),kr:K*bend(phase+Math.PI),al,ar,
    el:.22+.35*rb+.45*mb*Math.max(0,al/(Aa||1))*(.4+rb),er:.22+.35*rb+.45*mb*Math.max(0,ar/(Aa||1))*(.4+rb),
    ad:.5-.18*mb,sway:(.05+.28*rb)*mb+.04*Math.sin(phase*2)*mb};
  parts.forEach(m=>skin(m,P));
  holder.position.set(pos.x,pos.y+Math.abs(Math.cos(phase))*.035*H*mb*(1+rb),pos.z);
  holder.rotation.y=face;rig.rotation.x=(.04+.14*rb)*mb;
  // camera
  const dist=H*3.4,cp=Math.cos(camPitch);
  cam.position.set(pos.x+Math.sin(camYaw)*cp*dist,Math.max(pos.y+H*.35,pos.y+H*.9+Math.sin(camPitch)*dist),pos.z+Math.cos(camYaw)*cp*dist);
  cam.lookAt(pos.x,pos.y+H*.9,pos.z);
  R.render(S,cam);
}
loadChar();
</script></body></html>
