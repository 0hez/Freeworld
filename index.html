<script>

// ---- fake skeleton weights (the model has no rig) ----
function prep(m,type){
  const p=m.geometry.attributes.position,n=p.count,rest=p.array.slice(),w=new Float32Array(n*5);
  for(let i=0;i<n;i++){const x=rest[3*i],y=rest[3*i+1],z=rest[3*i+2],ax=Math.abs(x);
    let leg=0,knee=0,arm=0,el=0;

      arm=sm(.17,.25,ax)*sm(.55,.42,y)*sm(-.18,-.12,y);el=sm(.22,.06,y);
    }else if(type==='hand'){arm=1;el=1}

function rotX(o,py,pz,a,y,z){const c=Math.cos(a),s=Math.sin(a),dy=y-py,dz=z-pz;o[0]=py+dy*c-dz*s;o[1]=pz+dy*s+dz*c}

  for(let i=0;i<n;i++){
    let x=rest[3*i],y=rest[3*i+1],z=rest[3*i+2];const j=5*i,wl=w[j],s=w[j+1],wk=w[j+2],wa=w[j+3],we=w[j+4];
    if(type==='hair'){if(wl>0){rotX(t,.78,-.05,P.sway*wl,y,z);y=t[0];z=t[1]}}

      const L=x>0,sh=L?.19:-.19;

}

// ---- ground / simple collision ----

const groundAt=(x,z)=>{const h=hits(x,z,pos.y+.9*H,3*H);return h.length?h[0].point.y:null};
// road-level height inside one map (hit closest to y=0), used to match heights at map seams
function roadAt(list,x,z){
  const c=list.filter(m=>{const b=m.userData.b;return x>=b.min.x&&x<=b.max.x&&z>=b.min.z&&z<=b.max.z});
  if(!c.length)return null;
  og.set(x,2000,z);rc.set(og,dn);rc.far=4000;
  let best=null;for(const q of rc.intersectObjects(c,false)){const y=q.point.y;if(Math.abs(y)<4&&(best===null||Math.abs(y)<Math.abs(best)))best=y}
  return best;
}
function spawn(){
  const cx=(box.min.x+box.max.x)/2,cz=(box.min.z+box.max.z)/2,hh=box.max.y-box.min.y+2;
  for(let r=0;r<=.4;r+=.05)for(let a=0;a<6.3;a+=1.05){
    const x=cx+Math.cos(a)*r*ext,z=cz+Math.sin(a)*r*ext,h=hits(x,z,box.max.y+1,hh);
    if(h.length){pos.set(x,h[h.length-1].point.y,z);gy=pos.y;return}

}

// ---- sky, clouds, weather, background ----
const UNIT=1.8;

  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 vP;uniform vec3 sunDir,zen,hor,gnd,sunCol;uniform float sunAmt,moonAmt;'+
  'void main(){vec3 d=normalize(vP);float h=d.y;'+
  'vec3 c=h>0.?mix(hor,zen,pow(clamp(h,0.,1.),.45)):mix(hor,gnd,clamp(-h*4.,0.,1.));'+
  'float s=max(dot(d,sunDir),0.);c+=sunCol*(pow(s,900.)*6.+pow(s,60.)*.35+pow(s,6.)*.18)*sunAmt;'+
  'float m=max(dot(d,-sunDir),0.);c+=vec3(.9,.93,1.)*(smoothstep(.9992,.9996,m)*1.2+pow(m,200.)*.15)*moonAmt;'+
  'gl_FragColor=vec4(c,1.);}'}));
sky.frustumCulled=false;sky.renderOrder=-10;S.add(sky);
const stars=(()=>{const g=new THREE.BufferGeometry(),a=new Float32Array(900*3);
  for(let i=0;i<900;i++){let x,y,z,l;do{x=Math.random()*2-1;y=Math.random()*2-1;z=Math.random()*2-1;l=Math.hypot(x,y,z)}while(l>1||l<.1||y/l<-.05);a.set([x/l,y/l,z/l],3*i)}
  g.setAttribute('position',new THREE.BufferAttribute(a,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,transparent:true,opacity:0,depthWrite:false,fog:false}));
  p.frustumCulled=false;p.renderOrder=-9;S.add(p);return p})();
const KEYS=[[-12,0x040814,0x0c1428],[-3,0x1b2858,0x5a3a58],[2,0x2e4a8a,0xff9060],[10,0x3f78c0,0xf2c49c],[30,0x2c68c0,0xb8d6f2]];
const cB=new THREE.Color(),grey=new THREE.Color(),cc=new THREE.Color(),white=new THREE.Color(1,1,1),sdir=new THREE.Vector3();
function keyCols(el,zen,hor){
  let i=0;while(i<KEYS.length-1&&el>KEYS[i+1][0])i++;
  const a=KEYS[i],b=KEYS[Math.min(i+1,KEYS.length-1)],t=a===b?0:clamp((el-a[0])/(b[0]-a[0]),0,1);
  zen.setHex(a[1]).lerp(cB.setHex(b[1]),t);hor.setHex(a[2]).lerp(cB.setHex(b[2]),t);
}
const WXN=['Clear','Cloudy','Rain','Storm','Snow','Fog'];
const WXP={Clear:{cloud:.3,dark:0,rain:0,snow:0,fog:1,wind:.3,bolt:0},Cloudy:{cloud:.85,dark:.35,rain:0,snow:0,fog:.8,wind:.6,bolt:0},
  Rain:{cloud:1,dark:.6,rain:1,snow:0,fog:.55,wind:.8,bolt:0},Storm:{cloud:1,dark:.9,rain:1,snow:0,fog:.4,wind:2,bolt:1},
  Snow:{cloud:.9,dark:.3,rain:0,snow:1,fog:.5,wind:.4,bolt:0},Fog:{cloud:.6,dark:.3,rain:0,snow:0,fog:.12,wind:.15,bolt:0}};
const wc=Object.assign({},WXP.Clear);let wxI=0;
const TMN=['Day','Sunset','Night','Dawn','Auto'],TMPH=[1.3,Math.PI-.06,1.5*Math.PI,.1,null];let tmI=0,ph=1.3,phT=1.3;
let PLN,gapMeshes=[],clouds=[],cloudMats=[],cg,rainL,rainP,snowP,snowA,rp,sp,bolt,boltT=0,boltN=0,flash=0,boltTimer=4,envOn=false;
const RN=1600,SN=1400,HW=UNIT*35,HH=UNIT*22;
function cloudTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  for(let i=0;i<22;i++){const x=64+(Math.random()-.5)*70,y=64+(Math.random()-.5)*34,r=18+Math.random()*26,q=g.createRadialGradient(x,y,0,x,y,r);
    q.addColorStop(0,'rgba(255,255,255,.35)');q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(0,0,128,128)}
  return new THREE.CanvasTexture(c)}
function dotTex(){const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d'),q=g.createRadialGradient(16,16,0,16,16,16);
  q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(0,0,32,32);return new THREE.CanvasTexture(c)}
function buildGaps(){
  const C=14,M=80,x0=box.min.x-M,z0=box.min.z-M,nx=Math.ceil((box.max.x-box.min.x+2*M)/C),nz=Math.ceil((box.max.z-box.min.z+2*M)/C),cov=new Uint8Array(nx*nz);
  const area=(box.max.x-box.min.x)*(box.max.z-box.min.z)*.45;
  meshes.forEach(o=>{const b=o.userData.b;if((b.max.x-b.min.x)*(b.max.z-b.min.z)>area)return;
    const i0=clamp(Math.floor((b.min.x-x0)/C),0,nx-1),i1=clamp(Math.floor((b.max.x-x0)/C),0,nx-1),j0=clamp(Math.floor((b.min.z-z0)/C),0,nz-1),j1=clamp(Math.floor((b.max.z-z0)/C),0,nz-1);
    for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++)cov[j*nx+i]=1});
  const empty=(i,j)=>i>=0&&j>=0&&i<nx&&j<nz&&!cov[j*nx+i],isCov=(i,j)=>i>=0&&j>=0&&i<nx&&j<nz&&cov[j*nx+i]===1;

    for(let k=0;k<6;k++)gcol.push(.33*g,.4*g,.28*g);
    const inside=x>box.min.x-C&&x<box.max.x&&z>box.min.z-C&&z<box.max.z,n=Math.random()<(inside?.65:.4)?1+(Math.random()<.35?1:0):0;
    for(let t=0;t<n;t++)trees.push([x+3+Math.random()*(C-6),z+3+Math.random()*(C-6),.8+Math.random()*.8]);
    // road barriers along the edge that touches a map

      const cx=x+C/2+di*(C/2-.9),cz=z+C/2+dj*(C/2-.9),along=di===0;
      for(let k=-1;k<=1;k++)bars.push([cx+(along?k*4.6:0),cz+(along?0:k*4.6),along?0:Math.PI/2])});
  }

    const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.Float32BufferAttribute(gp,3));gg.setAttribute('color',new THREE.Float32BufferAttribute(gcol,3));gg.computeVertexNormals();
    const gm=new THREE.Mesh(gg,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}));
    S.add(gm);gm.updateMatrixWorld(true);gm.userData.b=new THREE.Box3().setFromObject(gm);gapMeshes.push(gm);
  }
  const mx=new THREE.Matrix4(),q=new THREE.Quaternion(),ps=new THREE.Vector3(),sc=new THREE.Vector3(),col=new THREE.Color(),up=new THREE.Vector3(0,1,0);

    const fg=new THREE.ConeGeometry(2.3,7,7);fg.translate(0,6.2,0);
    const tr=new THREE.InstancedMesh(tg,new THREE.MeshLambertMaterial({color:0x5a3d28}),trees.length),fo=new THREE.InstancedMesh(fg,new THREE.MeshLambertMaterial({color:0xffffff}),trees.length);
    trees.forEach((t,i)=>{q.setFromAxisAngle(up,Math.random()*6.28);ps.set(t[0],-.05,t[1]);sc.set(t[2],t[2],t[2]);mx.compose(ps,q,sc);tr.setMatrixAt(i,mx);fo.setMatrixAt(i,mx);
      const g=.8+Math.random()*.4;col.setRGB(.13*g,.36*g,.16*g);fo.setColorAt(i,col)});

    const bm=new THREE.InstancedMesh(bgm,new THREE.MeshLambertMaterial({color:0xc4c2ba}),bars.length),bb=new THREE.Box3();
    bars.forEach((b,i)=>{q.setFromAxisAngle(up,b[2]);ps.set(b[0],-.05,b[1]);sc.set(1,1,1);mx.compose(ps,q,sc);bm.setMatrixAt(i,mx);
      bb.expandByPoint(ps.clone().add(new THREE.Vector3(-3,0,-3)));bb.expandByPoint(ps.clone().add(new THREE.Vector3(3,2,3)))});

  }
}
function buildEnv(){
  S.fog=new THREE.Fog(0xa9c7e8,ext*.5,ext*2);
  const cx=(box.min.x+box.max.x)/2,cz=(box.min.z+box.max.z)/2,hx=(box.max.x-box.min.x)/2,hz=(box.max.z-box.min.z)/2;
  // original dark floor under everything (unchanged)
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(ext*8,ext*8),new THREE.MeshBasicMaterial({color:0x23272d}));
  pl.rotation.x=-Math.PI/2;pl.position.set(cx,-1.5,cz);S.add(pl);pl.updateMatrixWorld(true);pl.userData.b=new THREE.Box3().setFromObject(pl);PLN=pl;
  buildGaps();
  // clouds
  const tx=[cloudTex(),cloudTex(),cloudTex()];cloudMats=tx.map(t=>new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false,opacity:.8}));
  cg=new THREE.Group();S.add(cg);
  for(let i=0;i<46;i++){const s=new THREE.Sprite(cloudMats[i%3]),a=Math.random()*6.2832,r=ext*(.1+Math.random()*1.4),w=ext*(.25+Math.random()*.3);
    s.position.set(Math.cos(a)*r,ext*(.28+Math.random()*.14),Math.sin(a)*r);s.scale.set(w,w*.42,1);s.renderOrder=-5;cg.add(s);clouds.push(s)}
  // rain
  rp=new Float32Array(RN*3);for(let i=0;i<RN;i++)rp.set([(Math.random()*2-1)*HW,(Math.random()*2-1)*HH,(Math.random()*2-1)*HW],3*i);
  rainL=new Float32Array(RN*6);const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(rainL,3));
  rainP=new THREE.LineSegments(rg,new THREE.LineBasicMaterial({color:0xb8c8d8,transparent:true,opacity:.4,depthWrite:false,fog:false}));rainP.frustumCulled=false;rainP.visible=false;S.add(rainP);
  // snow
  sp=new Float32Array(SN*3);snowA=new Float32Array(SN);for(let i=0;i<SN;i++){sp.set([(Math.random()*2-1)*HW,(Math.random()*2-1)*HH,(Math.random()*2-1)*HW],3*i);snowA[i]=Math.random()*6.28}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  snowP=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:UNIT*.22,map:dotTex(),transparent:true,depthWrite:false,fog:false,opacity:.95}));snowP.frustumCulled=false;snowP.visible=false;S.add(snowP);
  // lightning bolt
  boltN=14;const bgm=new THREE.BufferGeometry();bgm.setAttribute('position',new THREE.BufferAttribute(new Float32Array(boltN*3),3));
  bolt=new THREE.Line(bgm,new THREE.LineBasicMaterial({color:0xe8f0ff,transparent:true,fog:false,depthWrite:false}));bolt.frustumCulled=false;bolt.visible=false;S.add(bolt);
  envOn=true;
}
function strike(){
  const a=Math.random()*6.2832,d=ext*(.35+Math.random()*.5),x0=cam.position.x+Math.cos(a)*d,z0=cam.position.z+Math.sin(a)*d,top=cam.position.y+ext*.3,pa=bolt.geometry.attributes.position;
  let x=x0,z=z0;for(let i=0;i<boltN;i++){const t=i/(boltN-1);pa.setXYZ(i,x,top*(1-t),z);x+=(Math.random()-.5)*ext*.035;z+=(Math.random()-.5)*ext*.035}

}
function env(dt){

  if(tmI===4)ph+=dt*2*Math.PI/300;else{let d=phT-ph;d=Math.atan2(Math.sin(d),Math.cos(d));ph+=d*Math.min(1,dt*1.6)}

  zen.lerp(grey,ov*.92);hor.lerp(grey,ov*.85);
  skyU.gnd.value.copy(hor).multiplyScalar(.5);skyU.sunDir.value.copy(sdir);
  skyU.sunCol.value.setHex(0xffb878).lerp(cB.setHex(0xfff4e6),sm(0,25,el));
  skyU.sunAmt.value=(1-ov)*sm(-6,-2,el);skyU.moonAmt.value=(1-ov*.85)*sm(-4,-12,el);
  stars.material.opacity=sm(-4,-14,el)*(1-ov);
  // fog + lights
  flash*=Math.exp(-dt*7);boltT-=dt;if(boltT<=0)bolt.visible=false;else bolt.material.opacity=clamp(boltT*8,0,1);
  if(wc.bolt>.5){boltTimer-=dt;if(boltTimer<=0){boltTimer=3+Math.random()*7;strike()}}
  S.fog.color.copy(hor).lerp(white,flash*.5);R.setClearColor(S.fog.color);
  const fm=Math.max(.08,wc.fog);S.fog.near=ext*.5*fm;S.fog.far=ext*2*fm;
  hemi.color.copy(white).lerp(hor,.35*(1-lk));hemi.groundColor.setHex(0x778899).multiplyScalar(.3+.7*lk);
  hemi.intensity=(.3+.8*lk)*(1-.35*ov)+flash*1.5;
  if(el>-3){const bl=sm(15,40,el);sun.position.set(.4,1,.3).normalize().multiplyScalar(100*bl).addScaledVector(sdir,100*(1-bl));sun.color.copy(skyU.sunCol.value).lerp(white,sm(10,30,el));sun.intensity=.9*sm(-2,10,el)*(1-.85*ov)}
  else{sun.position.copy(sdir).multiplyScalar(-100);sun.color.setHex(0x7f99ff);sun.intensity=.35*sm(-3,-10,el)*(1-.6*ov)}
  // clouds
  const k=(.3+.7*lk)*(1-.6*wc.dark),n=Math.round(clouds.length*clamp(wc.cloud,0,1)),R2=ext*1.5;
  cc.setRGB(k,k,k).lerp(hor,.3);cloudMats.forEach(m=>{m.color.copy(cc);m.opacity=.55+.4*ov});
  const ws=UNIT*(1+3*wc.wind)*dt;
  clouds.forEach((s,i)=>{s.visible=i<n;s.position.x+=ws;if(s.position.x>R2)s.position.x-=2*R2});
  // follow camera
  const cp=cam.position,cf=cam.far*.4;
  sky.position.copy(cp);sky.scale.setScalar(cf);stars.position.copy(cp);stars.scale.setScalar(cf);cg.position.set(cp.x,0,cp.z);
  // rain
  const wx=wc.wind*UNIT*3,t=performance.now()/1000;
  if(wc.rain>.02){rainP.visible=true;const fall=UNIT*22,cnt=Math.floor(RN*clamp(wc.rain,0,1));
    for(let i=0;i<RN;i++){let x=rp[3*i]+wx*dt,y=rp[3*i+1]-fall*dt,z=rp[3*i+2]+wx*.4*dt;
      let dx=x-cp.x,dy=y-cp.y,dz=z-cp.z;if(dx>HW)dx-=2*HW;else if(dx<-HW)dx+=2*HW;if(dz>HW)dz-=2*HW;else if(dz<-HW)dz+=2*HW;if(dy<-HH)dy+=2*HH;else if(dy>HH)dy-=2*HH;
      x=cp.x+dx;y=cp.y+dy;z=cp.z+dz;rp[3*i]=x;rp[3*i+1]=y;rp[3*i+2]=z;
      rainL[6*i]=x;rainL[6*i+1]=y;rainL[6*i+2]=z;rainL[6*i+3]=x-wx*.03;rainL[6*i+4]=y+fall*.03;rainL[6*i+5]=z-wx*.012}
    rainP.geometry.attributes.position.needsUpdate=true;rainP.geometry.setDrawRange(0,cnt*2);rainP.material.opacity=.15+.3*lk}
  else rainP.visible=false;
  // snow
  if(wc.snow>.02){snowP.visible=true;const fall=UNIT*1.6;
    for(let i=0;i<SN;i++){let x=sp[3*i]+(wx*.5+Math.sin(t*.7+snowA[i])*UNIT*.6)*dt,y=sp[3*i+1]-fall*dt*(.6+.8*((i*7)%10)/10),z=sp[3*i+2]+Math.cos(t*.5+snowA[i])*UNIT*.5*dt;
      let dx=x-cp.x,dy=y-cp.y,dz=z-cp.z;if(dx>HW)dx-=2*HW;else if(dx<-HW)dx+=2*HW;if(dz>HW)dz-=2*HW;else if(dz<-HW)dz+=2*HW;if(dy<-HH)dy+=2*HH;else if(dy>HH)dy-=2*HH;
      sp[3*i]=cp.x+dx;sp[3*i+1]=cp.y+dy;sp[3*i+2]=cp.z+dz}
    snowP.geometry.attributes.position.needsUpdate=true;snowP.geometry.setDrawRange(0,Math.floor(SN*clamp(wc.snow,0,1)));snowP.material.opacity=.5+.45*lk}
  else snowP.visible=false;
}

// ---- character + world ----
function setSize(){rig.scale.setScalar(H/1.83)}
const parseP=buf=>new Promise((ok,no)=>loader.parse(buf,'',ok,no));
async function fetchBuf(parts){
  const a=await Promise.all(parts.map(u=>fetch(u).then(r=>r.ok?r.arrayBuffer():Promise.reject(new Error(u+' not found')))));
  let n=0;a.forEach(x=>n+=x.byteLength);const o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(new Uint8Array(x),p);p+=x.byteLength});return o.buffer;
}
async function start(){
  try{
    $('msg').textContent='Loading character…';
    const g=await parseP(await fetchBuf(['mai_lite.glb']));
    holder=new THREE.Group();rig=new THREE.Group();rig.add(g.scene);g.scene.position.y=1;
    g.scene.traverse(o=>{if(!o.isMesh)return;const mt=o.material,nm=mt.name;
      mt.normalMap=null;mt.side=THREE.DoubleSide;mt.needsUpdate=true;o.geometry=o.geometry.clone();
      prep(o,nm.startsWith('uppr')?'body':nm.startsWith('lowr')?'hand':nm.startsWith('hair')?'hair':'head');
      if(o.userData.type!=='head')parts.push(o)});
    holder.add(rig);S.add(holder);
    const W=await (await fetch('world.json')).json(),SC=10;let x0=0,prev=null;
    const roadMat=new THREE.MeshLambertMaterial({color:0x3b3f46});
    for(const m of W.maps){
      $('msg').textContent='Loading '+m.name+'…';
      const root=(await parseP(await fetchBuf(m.parts))).scene;root.updateMatrixWorld(true);
      const cr=m.crop,wr=new THREE.Group();
      root.traverse(o=>{if(o.isMesh){const q=new THREE.Box3().setFromObject(o),c=(q.min.x+q.max.x)/2;if(c<cr[0]||c>cr[1])o.visible=false}});
      wr.add(root);
      if(m.ground){const g=m.ground,tx=new THREE.TextureLoader().load(g.img);tx.encoding=THREE.sRGBEncoding;tx.anisotropy=8;
        const tl=new THREE.Mesh(new THREE.PlaneGeometry(g.x[1]-g.x[0],g.z[1]-g.z[0]),new THREE.MeshBasicMaterial({map:tx,polygonOffset:true,polygonOffsetFactor:4,polygonOffsetUnits:8}));
        tl.rotation.x=-Math.PI/2;tl.position.set((g.x[0]+g.x[1])/2,m.floor+(m.ty||0),(g.z[0]+g.z[1])/2);wr.add(tl)}
      wr.scale.setScalar(SC);wr.position.set(x0-cr[0]*SC,-m.floor*SC,(m.dz||0)*SC);
      S.add(wr);wr.updateMatrixWorld(true);const seamX=x0;x0+=(cr[1]-cr[0])*SC;
      wr.traverse(o=>{if(o.isMesh&&o.visible){(Array.isArray(o.material)?o.material:[o.material]).forEach(q=>{if(q&&q.metalness>.3)q.metalness=.1})}});
      wr.traverse(o=>{if(o.isMesh&&o.visible){o.userData.b=new THREE.Box3().setFromObject(o);meshes.push(o)}});
    }
    box=new THREE.Box3();meshes.forEach(o=>box.union(o.userData.b));
    ext=Math.max(box.max.x-box.min.x,box.max.z-box.min.z);H=SC*.18;
    cam.near=H*.25;cam.far=ext*5;cam.updateProjectionMatrix();
    buildEnv();
    setSize();spawn();meshes.push(PLN,...gapMeshes);$('ld').hidden=true;$('bar').hidden=false;$('st').hidden=false;last=performance.now();loop();
  }catch(e){$('msg').textContent='Problem: '+(e&&e.message||e)}
}
// ---- input ----
let sx=0,sy=0,sid=null,so=null,lid=null,lx=0,ly=0;
const cv=$('c');
cv.addEventListener('pointerdown',e=>{
  if(e.clientX<innerWidth*.5&&sid===null){sid=e.pointerId;so=[e.clientX,e.clientY];const b=$('sb');b.style.display='block';b.style.left=so[0]+'px';b.style.top=so[1]+'px'}
  else if(lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}
});
addEventListener('pointermove',e=>{
  if(e.pointerId===sid){let dx=e.clientX-so[0],dy=e.clientY-so[1];const l=Math.hypot(dx,dy),m=60;if(l>m){dx*=m/l;dy*=m/l}
    sx=dx/m;sy=-dy/m;$('kn').style.transform=`translate(${dx}px,${dy}px)`}
  else if(e.pointerId===lid){camYaw-=(e.clientX-lx)*.006;camPitch=clamp(camPitch+(e.clientY-ly)*.005,.05,1.3);lx=e.clientX;ly=e.clientY}
});
const up=e=>{if(e.pointerId===sid){sid=null;sx=sy=0;$('sb').style.display='none';$('kn').style.transform=''}if(e.pointerId===lid)lid=null};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
$('run').onclick=e=>{run=!run;e.target.textContent=run?'Run':'Walk'};
$('sm').onclick=()=>{H/=1.25;setSize()};$('bg').onclick=()=>{H*=1.25;setSize()};
$('tm').onclick=e=>{tmI=(tmI+1)%TMN.length;if(TMPH[tmI]!==null)phT=TMPH[tmI];e.target.textContent=TMN[tmI]};
$('wx').onclick=e=>{wxI=(wxI+1)%WXN.length;boltTimer=1.5;e.target.textContent=WXN[wxI]};

// ---- fly buttons ----
let fly=false,air=false,vyA=0,vUp=0,vDn=0,flyG=0,fv=new THREE.Vector3();
const hold=(id,f)=>{const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();f(1)});['pointerup','pointerleave','pointercancel'].forEach(n=>e.addEventListener(n,()=>f(0)))};
hold('upb',v=>vUp=v);hold('dnb',v=>vDn=v);
$('fly').onclick=e=>{fly=!fly;e.target.textContent=fly?'Land':'Fly';$('vb').hidden=!fly;fv.set(0,0,0);if(!fly){air=true;vyA=0}};

// ---- main loop ----
let last=0;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
  const mag=Math.min(1,Math.hypot(sx,sy)),sY=Math.sin(camYaw),cY=Math.cos(camYaw);let tv=0;
  tickT-=dt;const tk=tickT<=0;if(tk)tickT=.06;
  let v=0,rb=0,mb=0,lean=0,flyMove=0;
  if(fly){
    const ang=clamp(-(camPitch-.35)*1.1,-1.2,1.2),ca=Math.cos(ang),sp=(run?11:5)*H,m=mag>.1?mag:0;
    const tx=(-sY*sy*ca+cY*sx)*m*sp,tz=(-cY*sy*ca-sY*sx)*m*sp,ty=(sy*Math.sin(ang)*m+vUp-vDn)*sp;
    fv.x+=(tx-fv.x)*Math.min(1,dt*4);fv.y+=(ty-fv.y)*Math.min(1,dt*4);fv.z+=(tz-fv.z)*Math.min(1,dt*4);
    pos.x+=fv.x*dt;pos.y+=fv.y*dt;pos.z+=fv.z*dt;
    if(tk){const h=hits(pos.x,pos.z,pos.y+.5*H,pos.y+.5*H-box.min.y+2);flyG=h.length?h[0].point.y:box.min.y}
    pos.y=Math.max(pos.y,flyG+.35*H);gy=pos.y;
    const hs=Math.hypot(fv.x,fv.z);if(hs>.05*H){let d=Math.atan2(fv.x,fv.z)-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*Math.min(1,dt*8)}
    flyMove=clamp(Math.hypot(fv.x,fv.y,fv.z)/(4*H),0,1);spd=0;
    lean=.15+(clamp(1.3-ang*.9,.2,1.5)-.15)*flyMove;phase+=dt*(2+4*flyMove);
  }else{
    if(mag>.1){dir.set(-sY*sy+cY*sx,0,-cY*sy-sY*sx).normalize();tv=(run?2.4:.85)*H*mag;
      let d=Math.atan2(dir.x,dir.z)-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*Math.min(1,dt*10)}
    spd+=(tv-spd)*Math.min(1,dt*8);
    if(air){
      blocked=false;vyA-=14*H*dt;pos.y+=vyA*dt;gy=pos.y;
      if(tk){const h=hits(pos.x,pos.z,pos.y+.5*H,pos.y+.5*H-box.min.y+2);tgt=h.length?h[0].point.y:box.min.y}
      if(tgt!==null&&pos.y<=tgt){pos.y=tgt;gy=tgt;air=false;vyA=0}
    }else if(tk){blocked=false;
      if(spd>.05*H){const l=spd*.25+.3*H,nx=pos.x+dir.x*l,nz=pos.z+dir.z*l,g=groundAt(nx,nz);
        if(g===null||g-pos.y>.4*H)blocked=true;else tgt=g}
      else{const g=groundAt(pos.x,pos.z);if(g!==null)tgt=g}}
    if(!blocked&&spd>.01){pos.x+=dir.x*spd*dt;pos.z+=dir.z*spd*dt}
    if(!air){if(tgt!==null)gy+=(tgt-gy)*Math.min(1,dt*12);pos.y=gy}
    v=blocked?0:spd/H;rb=clamp((v-.85)/1.5,0,1);mb=clamp(v/.3,0,1);
    phase+=2*Math.PI*(v*H)/(H*(.9+.3*rb))*dt;lean=(.04+.14*rb)*mb;
  }
  const A=(.42+.5*rb)*mb,K=(.75+.5*rb)*mb,Aa=(.38+.7*rb)*mb,sn=Math.sin(phase),sn2=Math.sin(phase+Math.PI);
  const bend=ph=>Math.max(0,Math.cos(ph+.3));
  let P;
  if(fly){const fl=Math.sin(phase*2)*.12;
    P={hl:-.3+fl,hr:-.45-fl,kl:.15+flyMove*.2,kr:.3,al:-.15,ar:-.15,el:.15,er:.15,ad:.55,sway:.1+.5*flyMove+.05*Math.sin(phase*3)};}
  else{const al=-Aa*sn,ar=-Aa*sn2;
    P={hl:A*sn,hr:A*sn2,kl:K*bend(phase),kr:K*bend(phase+Math.PI),al,ar,
    el:.22+.35*rb+.45*mb*Math.max(0,al/(Aa||1))*(.4+rb),er:.22+.35*rb+.45*mb*Math.max(0,ar/(Aa||1))*(.4+rb),
    ad:.5-.18*mb,sway:(.05+.28*rb)*mb+.04*Math.sin(phase*2)*mb};}
  parts.forEach(m=>skin(m,P));
  const bob=fly?Math.sin(phase)*.03*H:Math.abs(Math.cos(phase))*.035*H*mb*(1+rb);
  holder.position.set(pos.x,pos.y+bob,pos.z);holder.rotation.y=face;rig.rotation.x=lean;
  const dist=H*3.4,cp=Math.cos(camPitch),fo=fly?H*.5:H*.9;
  cam.position.set(pos.x+Math.sin(camYaw)*cp*dist,Math.max(pos.y+H*.35,pos.y+fo+Math.sin(camPitch)*dist),pos.z+Math.cos(camYaw)*cp*dist);
  cam.lookAt(pos.x,pos.y+fo,pos.z);
  env(dt);
  R.render(S,cam);
}
start();
